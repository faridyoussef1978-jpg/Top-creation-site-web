h2{text-align:center;font-size:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:1000px;margin:30px auto}
.card{background:white;padding:27px;border-radius:16px;box-shadow:0 5px 20px #00000012;text-align:center}
.price{font-size:34px;font-weight:bold;color:#2458a6}
.steps{font-size:14px;line-height:1.5;margin-top:18px}
.portfolio{background:#eef3fb}

.business{background:linear-gradient(135deg,#18375d,#4d82bd)}
.beauty{background:linear-gradient(135deg,#8a536e,#d69db7)}
.contact{text-align:center}
